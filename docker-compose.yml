# Starts PostgreSQL for local development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - sweety-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sweety-data:
